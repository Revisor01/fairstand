name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    strategy:
      matrix:
        teil: [client, server]
    uses: Revisor01/workflows/.github/workflows/docker-image.yml@20bd05cfcd9ba14fcc96912d0830ddf1d260252f # 1.5.2
    permissions:
      contents: read
      packages: write
    with:
      image: ghcr.io/${{ github.repository }}/${{ matrix.teil }}
      kontext: ./${{ matrix.teil }}
      build-args: |
        GIT_SHA=${{ github.sha }}

  # Forks bauen ihre Images, ausgerollt wird nur die eigene Instanz.
  deploy:
    needs: image
    if: github.event_name != 'pull_request' && github.repository == 'Revisor01/fairstand'
    uses: Revisor01/workflows/.github/workflows/portainer-deploy.yml@20bd05cfcd9ba14fcc96912d0830ddf1d260252f # 1.5.2
    with:
      pruef-url: https://fairstand.godsapp.de/api/health
      revision-feld: .commit
    secrets:
      webhook: ${{ secrets.PORTAINER_WEBHOOK_URL }}
