name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    strategy:
      matrix:
        teil: [client, server]
    uses: Revisor01/workflows/.github/workflows/docker-image.yml@9eb921a3c730493b1aea79d5b22bf655356d5e43 # 1.2.0
    permissions:
      contents: read
      packages: write
    with:
      image: ghcr.io/${{ github.repository }}/${{ matrix.teil }}
      kontext: ./${{ matrix.teil }}

  # Forks bauen ihre Images, ausgerollt wird nur die eigene Instanz.
  deploy:
    needs: image
    if: github.event_name != 'pull_request' && github.repository == 'Revisor01/fairstand'
    uses: Revisor01/workflows/.github/workflows/portainer-deploy.yml@9eb921a3c730493b1aea79d5b22bf655356d5e43 # 1.2.0
    with:
      pruef-url: https://fairstand.godsapp.de/api/health
    secrets:
      webhook: ${{ secrets.PORTAINER_WEBHOOK_URL }}
