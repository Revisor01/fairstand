name: Build and Deploy

on:
  push:
    branches: [main]

permissions: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
      REGISTRY: ghcr.io
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/fairstand
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lowercase image prefix
        run: echo "IMAGE_PREFIX=$(echo $IMAGE_PREFIX | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push client
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./client
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/client:latest

      - name: Build and push server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./server
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/server:latest

      # Ohne Webhook (Fork, frische Instanz) endet der Lauf nach dem Push der
      # Abbilder. Das Step-env ist im if noch nicht sichtbar, daher Job-env.
      - name: Trigger Portainer Webhook
        if: env.WEBHOOK_URL != ''
        run: curl -fsS -X POST "$WEBHOOK_URL"
